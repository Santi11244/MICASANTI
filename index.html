<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Desde el 14/02/2025 ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Fugaz One',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
  text-align:center;
  transition:background 1s,color 1s;
}

/* ----------- ESTADO NORMAL ----------- */
.normal{
  background:white;
  color:red;
}

.normal #timer{
  font-size:2.5rem;
  padding:20px;
  border-radius:12px;
  border:4px solid red;
  background:repeating-linear-gradient(
    45deg,
    white,
    white 10px,
    white 10px,
    white 20px
  );
  color:red;
  animation:blinkBorder 0.9s infinite;
}

@keyframes blinkBorder{
  0%,100%{border-color:red;}
  50%{border-color:white;}
}

/* ----------- ANIVERSARIO ----------- */
.anniversary{
  background:#0b3d91;
  color:white;
}

.rainbow{
  animation:rainbowFlash .5s infinite;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
}

@keyframes rainbowFlash{
  0%{color:red;}
  16%{color:orange;}
  33%{color:yellow;}
  50%{color:green;}
  66%{color:blue;}
  83%{color:purple;}
  100%{color:red;}
}

.anniversary #timer{
  font-size:2.2rem;
  padding:20px;
  border-radius:12px;
  border:4px solid black;
  background:white;
  color:black;
}

/* ----------- ESTRELLAS ----------- */
#stars{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  display:none;
}

.star{
  position:absolute;
  width:3px;height:3px;
  background:white;
  border-radius:50%;
  animation:twinkle 1.5s infinite ease-in-out;
}

@keyframes twinkle{
  0%,100%{opacity:.2;}
  50%{opacity:1;}
}

h1{margin-bottom:20px;}
#phrase{margin-bottom:25px;font-size:1.4rem;}
</style>
</head>

<body class="normal">

<div id="stars"></div>

<h1 id="title">Desde ese 14 de febrero de 2025 hasta hoy ❤️</h1>
<div id="phrase"></div>
<div id="timer">Cargando...</div>

<script>
const startDate=new Date('2025-02-14T00:00:00');
const body=document.body;
const title=document.getElementById('title');
const phrase=document.getElementById('phrase');
const timer=document.getElementById('timer');
const stars=document.getElementById('stars');

const phrases=[
"Te amo Crazy",
"Que pasa con vos :$",
"Que lindo haberte conocido",
"₍ᐢ. .ᐢ₎",
"The life talk me about you all time",
"Si estas leyendo esto seguramente estés al dope",
"TE QUIERO MICAAA",
"Amores así ya no existen OOAAAaa (i<3u)",
"Te amo para siempre 🥹",
"Mujer hermosa 😍",
"Grrr 😸"
];

// ⭐ frase aleatoria SOLO al entrar
phrase.textContent=phrases[Math.floor(Math.random()*phrases.length)];

// ⭐ estrellas
for(let i=0;i<80;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.top=Math.random()*100+'%';
  s.style.left=Math.random()*100+'%';
  s.style.animationDelay=(Math.random()*2)+'s';
  stars.appendChild(s);
}

function updateTimer(){
  const now=new Date();
  const diff=now-startDate;

  const days=Math.floor(diff/(1000*60*60*24));
  const hours=Math.floor(diff/(1000*60*60))%24;
  const minutes=Math.floor(diff/(1000*60))%60;
  const seconds=Math.floor(diff/1000)%60;

  timer.textContent=`${days} días, ${hours} horas, ${minutes} minutos, ${seconds} segundos`;

  // 🎉 cada 365 días
  if(days>0 && days%365===0){
    body.className='anniversary';
    stars.style.display='block';
    title.classList.add('rainbow');
    phrase.classList.add('rainbow');
    phrase.textContent="A un año de conocernos y miles de historias mas juntos, te amo por siempre <3";
  }else{
    body.className='normal';
    stars.style.display='none';
    title.classList.remove('rainbow');
    phrase.classList.remove('rainbow');
  }
}

setInterval(updateTimer,1000);
updateTimer();
</script>

</body>
</html>
