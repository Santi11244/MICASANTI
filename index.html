<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Preview Día 365</title>

<link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Fugaz One', sans-serif;
  background: #0b3d91;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
  text-align: center;
  overflow: hidden;
}

/* 🌈 Arcoíris SOLO texto */
.rainbow {
  animation: rainbowFlash 0.5s infinite;
  text-shadow: 
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
}

@keyframes rainbowFlash {
  0%{color:red;}
  16%{color:orange;}
  33%{color:yellow;}
  50%{color:green;}
  66%{color:blue;}
  83%{color:purple;}
  100%{color:red;}
}

/* ⭐ Estrellas */
#stars {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  animation: twinkle 1.5s infinite ease-in-out;
}

@keyframes twinkle {
  0%,100% { opacity: 0.2; }
  50% { opacity: 1; }
}

h1 { margin-bottom: 20px; }

#phrase {
  margin-bottom: 25px;
  font-size: 1.4rem;
}

#timer {
  font-size: 2.2rem;
  padding: 20px;
  border-radius: 12px;
  border: 4px solid black;
  background: white;
  color: black;
}
</style>
</head>

<body>

<div id="stars"></div>

<h1 class="rainbow">Desde ese 14 de febrero de 2025 hasta hoy ❤️</h1>

<div id="phrase" class="rainbow">
A un año de conocernos y miles de historias mas juntos, te amo por siempre &lt;3
</div>

<div id="timer">
365 días, 0 horas, 0 minutos, 0 segundos
</div>

<script>
// Generar estrellas
const starsContainer = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.top = Math.random() * 100 + '%';
  star.style.left = Math.random() * 100 + '%';
  star.style.animationDelay = (Math.random() * 2) + 's';
  starsContainer.appendChild(star);
}
</script>

</body>
</html>

</body>
</html>
