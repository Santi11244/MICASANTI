<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Desde el 14/02/2025 ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Fugaz One',sans-serif;
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  transition:all 1s ease;
}

/* ===== ESTADO NORMAL ===== */
.normal{
  background:white;
  color:red;
}

#timer{
  font-size:2.2rem;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  transition:all .5s ease;
}

/* Timer NORMAL a rayas */
.normal #timer{
  border:4px solid red;
  background:repeating-linear-gradient(
    45deg,
    white,
    white 10px,
    red 10px,
    red 20px
  );
  color:white;
  text-shadow:2px 2px 4px black;
  animation:blinkBorder 1s infinite;
}

@keyframes blinkBorder{
  0%{border-color:red;}
  50%{border-color:white;}
  100%{border-color:red;}
}

/* ===== ESTADO ANIVERSARIO ===== */
.anniversary{
  background:#0b3d91;
  color:white;
}

/* Texto arcoíris con borde negro */
.anniversary .rainbow{
  animation:rainbowFlash .5s infinite;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
}

@keyframes rainbowFlash{
  0%{color:red;}
  16%{color:orange;}
  33%{color:yellow;}
  50%{color:green;}
  66%{color:blue;}
  83%{color:purple;}
  100%{color:red;}
}

/* Timer limpio aniversario */
.anniversary #timer{
  background:white;
  border:4px solid black;
  color:black;
  text-shadow:none;
  animation:none;
}

/* ⭐ Estrellas */
#stars{
  position:fixed;
  inset:0;
  pointer-events:none;
  display:none;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation:twinkle 1.5s infinite ease-in-out;
}

@keyframes twinkle{
  0%,100%{opacity:.2;}
  50%{opacity:1;}
}
</style>
</head>

<body class="normal">

<div id="stars"></div>

<h1 id="title">Desde ese 14 de febrero de 2025 hasta hoy ❤️</h1>
<div id="phrase"></div>
<div id="timer">Cargando...</div>

<script>
const startDate = new Date('2025-02-14T00:00:00');

const phrases=[
"Te amo Cracy",
"Que pasa con vos :$",
"Que lindo haberte conocido",
"₍ᐢ. .ᐢ₎",
"The life talk me about you all time",
"Si estas leyendo esto seguramente estés al dope",
"TE QUIERO MICAAA",
"Amores así ya no existen OOAAAaa (i<3u)",
"Te amo para siempre 🥹",
"Mujer hermosa 😍",
"Grrr 😸"
];

const body=document.body;
const phrase=document.getElementById('phrase');
const stars=document.getElementById('stars');
const title=document.getElementById('title');

for(let i=0;i<80;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.top=Math.random()*100+'%';
  s.style.left=Math.random()*100+'%';
  s.style.animationDelay=Math.random()*2+'s';
  stars.appendChild(s);
}

function updateTimer(){
  const now=new Date();
  const diff=now-startDate;

  const s=Math.floor(diff/1000)%60;
  const m=Math.floor(diff/60000)%60;
  const h=Math.floor(diff/3600000)%24;
  const d=Math.floor(diff/86400000);

  timer.textContent=`${d} días, ${h} horas, ${m} minutos, ${s} segundos`;

  const isAnniversary=d>0 && d%365===0;

  if(isAnniversary){
    body.className='anniversary';
    stars.style.display='block';
    title.classList.add('rainbow');
    phrase.classList.add('rainbow');
    phrase.textContent="A un año de conocernos y miles de historias mas juntos, te amo por siempre <3";
  }else{
    body.className='normal';
    stars.style.display='none';
    title.classList.remove('rainbow');
    phrase.classList.remove('rainbow');
    phrase.textContent=phrases[Math.floor(Math.random()*phrases.length)];
  }
}

setInterval(updateTimer,1000);
updateTimer();
</script>

</body>
</html>
