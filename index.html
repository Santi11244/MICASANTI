<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cronómetro desde el 14/02/2025</title>

<!-- Fuente Fugaz One -->
<link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Fugaz One', sans-serif;
  background: white;
  color: red;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
  text-align: center;
}

h1 {
  margin-bottom: 30px;
  font-size: 2rem;
}

#timer-container {
  display: inline-block;
  padding: 5px;
  background: repeating-linear-gradient(
    45deg,
    red,
    red 10px,
    white 10px,
    white 20px
  );
  animation: stripesMove 1s linear infinite, flashColors 1s infinite;
  border-radius: 12px;
}

#timer {
  font-size: 2rem;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

#phrase {
  font-size: 1.5rem;
  max-width: 80%;
  white-space: pre-wrap;
  margin-top: 20px;
}

/* 🌈 EFECTO ANIVERSARIO */
.rainbow {
  animation: rainbowFlash 0.5s infinite;
}

@keyframes rainbowFlash {
  0%   { color: red; }
  16%  { color: orange; }
  33%  { color: yellow; }
  50%  { color: green; }
  66%  { color: blue; }
  83%  { color: purple; }
  100% { color: red; }
}

@keyframes stripesMove {
  0% { background-position: 0 0; }
  100% { background-position: 40px 0; }
}

@keyframes flashColors {
  0%,100% {
    background: repeating-linear-gradient(
      45deg, red, red 10px, white 10px, white 20px
    );
  }
  50% {
    background: repeating-linear-gradient(
      45deg, white, white 10px, red 10px, red 20px
    );
  }
}
</style>
</head>

<body>

<h1 id="title">Desde ese 14 de febrero de 2025 hasta hoy ❤️</h1>

<div id="timer-container">
  <div id="timer">Cargando...</div>
</div>

<div id="phrase"></div>

<script>
const startDate = new Date('2025-02-14T00:00:00');

const title = document.getElementById('title');
const timer = document.getElementById('timer');
const phrase = document.getElementById('phrase');

function updateTimer() {
  const now = new Date();
  const diff = now - startDate;

  const seconds = Math.floor(diff / 1000) % 60;
  const minutes = Math.floor(diff / (1000 * 60)) % 60;
  const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));

  timer.textContent =
    `${days} días, ${hours} horas, ${minutes} minutos, ${seconds} segundos`;

  // 🎉 EFECTO SOLO CADA 365 DÍAS (1 día exacto)
  if (days > 0 && days % 365 === 0) {
    title.classList.add('rainbow');
    timer.classList.add('rainbow');
    phrase.classList.add('rainbow');
  } else {
    title.classList.remove('rainbow');
    timer.classList.remove('rainbow');
    phrase.classList.remove('rainbow');
  }
}

setInterval(updateTimer, 1000);
updateTimer();

// Frases aleatorias
const frases = [
  "Te amo Cracy",
  "Que pasa con vos :$",
  "Que lindo haberte conocido",
  "₍ᐢ. .ᐢ₎",
  "The life talk me about you all time",
  "Si estas leyendo esto seguramente estés al dope",
  "TE QUIERO MICAAA",
  "Amores así ya no existen OOAAAaa (i<3u)",
  "Te amo para siempre 🥹",
  "Mujer hermosa 😍",
  "Grrr 😸"
];

phrase.textContent = frases[Math.floor(Math.random() * frases.length)];
</script>

</body>
</html>
