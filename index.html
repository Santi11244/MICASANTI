<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Desde el 14/02/2025 ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Fugaz One', sans-serif;
  background: white;
  color: red;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
  text-align: center;
  transition: background 1s ease, color 1s ease;
  overflow: hidden;
}

h1 { margin-bottom: 20px; }

#phrase {
  margin-bottom: 25px;
  font-size: 1.4rem;
}

#timer {
  font-size: 2.2rem;
  padding: 20px;
  border-radius: 12px;
  border: 4px solid red;
  background: repeating-linear-gradient(
    45deg,
    white,
    white 10px,
    red 10px,
    red 20px
  );
  animation: blinkBorder 1s infinite;
}

@keyframes blinkBorder {
  0% { border-color: red; }
  50% { border-color: white; }
  100% { border-color: red; }
}

/* 🌈 Arcoíris */
.rainbow {
  animation: rainbowFlash 0.5s infinite;
}

@keyframes rainbowFlash {
  0%{color:red;}
  16%{color:orange;}
  33%{color:yellow;}
  50%{color:green;}
  66%{color:blue;}
  83%{color:purple;}
  100%{color:red;}
}

/* 🌌 Modo aniversario */
.night {
  background: #0b3d91 !important;
  color: white !important;
}

/* ⭐ Estrellas */
#stars {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  display: none;
}

.star {
  position: absolute;
  width: 3px; height: 3px;
  background: white;
  border-radius: 50%;
  animation: twinkle 1.5s infinite ease-in-out;
}

@keyframes twinkle {
  0%,100% { opacity: 0.2; }
  50% { opacity: 1; }
}

/* ✨ Texto con borde negro SOLO aniversario */
.anniversary-text {
  text-shadow: 
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
}

/* 📦 Timer limpio SOLO aniversario */
.anniversary-timer {
  background: white !important;
  border: 4px solid black !important;
  animation: none !important;
  color: black !important;
}
</style>
</head>

<body>

<div id="stars"></div>

<h1 id="title">Desde ese 14 de febrero de 2025 hasta hoy ❤️</h1>
<div id="phrase"></div>
<div id="timer">Cargando...</div>

<script>
const startDate = new Date('2025-02-14T00:00:00');

const phrases = [
"Te amo Cracy",
"Que pasa con vos :$",
"Que lindo haberte conocido",
"₍ᐢ. .ᐢ₎",
"The life talk me about you all time",
"Si estas leyendo esto seguramente estés al dope",
"TE QUIERO MICAAA",
"Amores así ya no existen OOAAAaa (i<3u)",
"Te amo para siempre 🥹",
"Mujer hermosa 😍",
"Grrr 😸"
];

const title = document.getElementById('title');
const timer = document.getElementById('timer');
const phraseElement = document.getElementById('phrase');
const body = document.body;
const starsContainer = document.getElementById('stars');

/* Crear estrellas */
for (let i = 0; i < 80; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.top = Math.random() * 100 + '%';
  star.style.left = Math.random() * 100 + '%';
  star.style.animationDelay = (Math.random() * 2) + 's';
  starsContainer.appendChild(star);
}

function setPhrase(days) {
  if (days > 0 && days % 365 === 0) {
    phraseElement.textContent =
      "A un año de conocernos y a muchos de miles de historias más juntos, te amo por siempre <3";
  } else {
    const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
    phraseElement.textContent = randomPhrase;
  }
}

function updateTimer() {
  const now = new Date();
  const diff = now - startDate;

  const seconds = Math.floor(diff / 1000) % 60;
  const minutes = Math.floor(diff / (1000 * 60)) % 60;
  const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));

  timer.textContent =
    `${days} días, ${hours} horas, ${minutes} minutos, ${seconds} segundos`;

  setPhrase(days);

  if (days > 0 && days % 365 === 0) {
    title.classList.add('rainbow','anniversary-text');
    timer.classList.add('rainbow','anniversary-text','anniversary-timer');
    phraseElement.classList.add('rainbow','anniversary-text');

    body.classList.add('night');
    starsContainer.style.display = 'block';
  } else {
    title.classList.remove('rainbow','anniversary-text');
    timer.classList.remove('rainbow','anniversary-text','anniversary-timer');
    phraseElement.classList.remove('rainbow','anniversary-text');

    body.classList.remove('night');
    starsContainer.style.display = 'none';
  }
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
